   Four themes, picked in Settings → Appearance and set as data-theme on <html>:
   classic (this :root block, the original look), cherry-dark and cherry-light (colours from the
   brand sheet) and just-black (jet black, vivid accent), as overrides at the end. Import once at the app root; never hard-code hex in
   components. */

/* Fonts are self-hosted (@fontsource-variable/geist and geist-mono, imported in packages/web/src/main.tsx),
   so nothing is fetched from the internet. */

:root,
[data-theme='classic'] {
  color-scheme: dark;

  /* Surfaces */
  --bg: #0b0b0c;            /* page */
  --s1: #141416;            /* cards, panels */
  --s2: #1c1c1f;            /* inputs, secondary buttons, inner boxes */
  --s3: #26262a;            /* selected rows, active nav, phase pills (done) */
  --code-bg: #101012;       /* code blocks, file viewer */
  --code-bg-deep: #0e0e10;  /* file viewer body, calibrate preview */
  --s-float: #111113;       /* floating panels (Magnet) */

  /* Borders */
  --tint: #ffffff;          /* the colour hairlines and hover borders are mixed from */
  --b: rgba(255, 255, 255, 0.08);   /* default hairline */
  --bs: rgba(255, 255, 255, 0.14);  /* strong: inputs, focused cards, dashed future phase */
  --b-faint: rgba(255, 255, 255, 0.07); /* tree indent guides, timeline rail */

  /* Text */
  --t1: #ededef;            /* primary */
  --t2: #a1a1aa;            /* secondary */
  --t3: #85858f;            /* hints — raised from #71717a so it passes 4.5:1 on --s1 */
  --t-code: #d4d4d8;        /* code text */
  --t-on-primary: #0b0b0c;  /* text on the white primary pill */
  --primary-hover: #ffffff; /* primary pill on hover */
  --t-on-accent: #ffffff;   /* text on an accent fill */
  --knob: #ffffff;          /* switch knob */
  --t-gutter: #5f5f68;      /* line numbers */
  --wordmark: var(--t1);    /* the cherry_ wordmark on the page background */
  --wordmark-cursor: var(--accent); /* its blinking cursor */

  /* Accent (blue) — focus, links, current phase, selection */
  /* Brand (docs/design-system.md → Brand): logo, wordmark and icons only, not UI states */
  --brand-cherry: #5a0f17;  /* badge, icon tile, wordmark on cream */
  --brand-cream: #f5eee4;   /* wordmark on dark, icon branch, app icon tile */
  --brand-coral: #e07a5f;   /* the typing cursor */
  --brand-leaf: #2f5d3a;    /* branch cherry stems */
  --brand-ink: #1e1414;     /* dark brand card */
  --accent: #5b8def;
  --accent-text: #8db0f4;   /* accent used as text (passes 4.5:1) */
  --accent-text-strong: #b3cbf8; /* text on accent-tinted fills, link hover */
  --accent-fill: rgba(91, 141, 239, 0.16);
  --accent-fill-weak: rgba(91, 141, 239, 0.08);
  --accent-border: rgba(91, 141, 239, 0.55);

  /* Status — colour only for meaning */
  --success: #3fb950;
  --success-fill: rgba(63, 185, 80, 0.12);
  --warning: #d29922;
  --warning-fill: rgba(210, 153, 34, 0.12);
  --danger: #f85149;
  --danger-text: #f7a39e;
  --danger-fill: rgba(248, 81, 73, 0.12);
  --edited: #a371f7;        /* Claude edits, "Edited" rows */
  --edited-fill: rgba(163, 113, 247, 0.16);
  --neutral-fill: rgba(255, 255, 255, 0.06);

  /* File type tags in the file tree (language colours, lightened to read on --s1) */
  --ft-ts: #5b9cf0;
  --ft-js: #e8cf5a;
  --ft-json: #d9a54a;
  --ft-md: #7fb8e8;
  --ft-yml: #e07a7a;
  --ft-toml: #c9875f;
  --ft-css: #b58cf0;
  --ft-html: #ef8a5f;
  --ft-py: #6fb3d9;
  --ft-rs: #e09a6f;
  --ft-go: #5ec8d8;
  --ft-sh: #8fd17a;
  --ft-sql: #e6a0c4;
  --ft-env: #d6c46a;
  --ft-lock: #85858f;
  --ft-img: #d68fd0;
  --git-untracked: #7fae86;

  /* Scrollbars: thin overlay-style thumb, no track or arrows */
  --scroll-thumb: rgba(255, 255, 255, 0.12);
  --scroll-thumb-hover: rgba(255, 255, 255, 0.24);

  /* Diff */
  --diff-add-text: #7ee08a;
  --diff-add-bg: rgba(63, 185, 80, 0.14);
  --diff-del-text: #f7a39e;
  --diff-del-bg: rgba(248, 81, 73, 0.12);

  /* Phase bar */
  --phase-done: #4a4a52;
  --phase-current: var(--accent);
  --phase-future: rgba(255, 255, 255, 0.18); /* used as inset 1px outline */

  /* Heatmap (Settings usage), low → high */
  --heat-0: #1c1c1f;
  --heat-1: #1f2d4a;
  --heat-2: #2c4c86;
  --heat-3: #4373cc;
  --heat-4: #7aa3f4;

  /* Magnet character */
  --magnet-head: #e6eaf2;
  --magnet-visor: #101320;
  --magnet-body: #3a4a6b;
  --magnet-tile: #16203a;

  /* Type */
  --sans: "Geist Variable", "Geist", ui-sans-serif, system-ui, sans-serif;
  --mono: "Geist Mono Variable", "Geist Mono", ui-monospace, Menlo, monospace;
  --fs-2xs: 11px;    /* tags, section labels (uppercase), heatmap months */
  --fs-xs: 11.5px;   /* pills, badges, meta */
  --fs-sm: 12px;     /* most UI meta, timeline targets, buttons in panels */
  --fs-sm2: 12.5px;  /* table cells, secondary lines */
  --fs-base: 13px;   /* body UI */
  --fs-md: 13.5px;   /* row titles */
  --fs-lg: 14px;     /* chat text, primary buttons */
  --fs-xl: 16px;     /* card + section titles */
  --fs-2xl: 20px;    /* stat numbers */
  --fs-3xl: 28px;    /* page titles (Settings) */
  --fs-4xl: 32px;    /* Home greeting */
  --lh-body: 1.55;
  --lh-chat: 1.65;
  --tracking-tight: -0.01em;
  --tracking-display: -0.025em;

  /* Spacing — 4 px grid */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;
  --sp-10: 40px;
  --sp-12: 48px;

  /* Radius */
  --r-xs: 3px;    /* phase segments, heatmap cells */
  --r-sm: 6px;    /* git chips, stack tags, type tags */
  --r-md: 8px;    /* nav rows, small boxes */
  --r-lg: 10px;   /* inner boxes, option rows, "why" box */
  --r-xl: 12px;   /* cards, panels, tables */
  --r-2xl: 14px;  /* decision + approval cards */
  --r-3xl: 16px;  /* big prompt box */
  --r-pill: 999px;

  /* Layout */
  --topbar-h: 56px;
  --left-w: 280px;
  --right-w: 360px;
  --home-max: 1088px;
  --prompt-max: 760px;

  /* V3 layout (ADR-0045; docs/design/screens/v3/v3.css) */
  --v3-top-h: 48px;
  --v3-status-h: 26px;
  --v3-rail-w: 44px;
  --v3-rail-panel-w: 340px;
  --v3-explorer-w: 248px;
  --v3-docs-w: 480px;       /* Plan: the Documents panel */
  --v3-brief-w: 284px;      /* Design: the Brief panel */
  --v3-side-chat-w: 392px;  /* Design and Deployment: the right column */
  --v3-cc-fs: 13px;         /* Claude Code chat text */
  --v3-cc-lh: 1.6;
  --v3-spinner: var(--brand-coral); /* the turning star; the wordmark cursor's coral */

  /* Control heights */
  --h-pill-sm: 22px;  /* badges */
  --h-chip: 26px;     /* phase pills, segmented */
  --h-btn-sm: 30px;
  --h-btn: 32px;
  --h-btn-md: 36px;
  --h-btn-lg: 44px;   /* Start project, primary CTAs (touch target) */
  --h-row: 32px;      /* timeline, tree rows */

  /* Motion */
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --dur-fast: 120ms;
  --dur: 200ms;

  /* Effects */
  --focus-ring: 0 0 0 2px var(--accent);
  --status-dot-glow-success: 0 0 0 3px rgba(63, 185, 80, 0.18);
  --home-glow: radial-gradient(ellipse 900px 320px at 50% -60px, rgba(91, 141, 239, 0.16), rgba(91, 141, 239, 0) 70%);
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--t1); font-family: var(--sans); font-size: var(--fs-base); }
a { color: var(--accent-text); text-decoration: none; }
a:hover { color: var(--accent-text-strong); }
button { font: inherit; color: inherit; }
:is(a, button, input, textarea, [tabindex]):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, kbd, pre, .mono { font-family: var(--mono); }

@keyframes ap-spin { to { transform: rotate(360deg); } }
@keyframes ap-pulse { 50% { opacity: 0.35; } }
@keyframes ap-shimmer { 50% { opacity: 0.5; } }
@keyframes ap-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}


/* ---------- Office additions (new tokens for V4) ---------- */
:root {
  --office-paper: #f0efed;     /* stage card, open: the plan sketch's paper */
  --office-ink: #c0280a;       /* brush name on paper */
  --office-red: #d92b26;       /* stage card, signed off (sketch #ff3333, darkened for AA) */
  --office-on-red: #f6f3ef;
  --office-locked: var(--s1);
  --brush: var(--sans);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--t1);
  font-family: var(--sans);
  font-size: var(--fs-base);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--r-sm); }
.ic { flex: none; display: block; }
.wordmark { display: block; color: var(--wordmark); }
.wm-cursor { fill: var(--wordmark-cursor); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
.mono { font-family: var(--mono); }
.t2 { color: var(--t2); } .t3 { color: var(--t3); }
.grow { flex: 1 1 0; min-width: 0; }
.row { display: flex; align-items: center; gap: var(--sp-2); }
.col { display: flex; flex-direction: column; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); background-clip: content-box; border: 3px solid transparent; }

/* ---------- App frame ---------- */
#app { height: 100dvh; display: flex; flex-direction: column; }
.top {
  height: var(--v3-top-h); flex: none;
  display: flex; align-items: center; gap: 10px;
  padding: 0 var(--sp-3) 0 var(--sp-4);
  border-bottom: 1px solid var(--b);
}
.top .badge { width: 22px; height: 22px; }
.crumb { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--t2); }
.crumb .sep { color: var(--t3); }
.crumb b { color: var(--t1); font-weight: 500; white-space: nowrap; }
.crumb button { background: none; border: 0; color: var(--t2); padding: 4px 6px; border-radius: var(--r-md); }
.crumb button:hover { background: var(--neutral-fill); color: var(--t1); }
.view { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
.scroll { overflow: auto; flex: 1 1 0; min-height: 0; }
.status {
  height: var(--v3-status-h); flex: none; border-top: 1px solid var(--b);
  display: flex; align-items: center; gap: 16px; padding: 0 var(--sp-3);
  font-family: var(--mono); font-size: var(--fs-2xs); color: var(--t3);
}
.status .ic { display: inline-block; vertical-align: -2px; margin-right: 4px; }

/* ---------- Buttons and small controls ---------- */
.btn {
  height: var(--h-btn); padding: 0 12px; border-radius: var(--r-md);
  border: 1px solid var(--bs); background: var(--s2); color: var(--t1);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  font-size: var(--fs-base); font-weight: 500;
  transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), opacity var(--dur-fast);
}
.btn:hover { background: var(--s3); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--t1); color: var(--t-on-primary); border-color: transparent; }
.btn.primary:hover { background: var(--primary-hover); }
.btn.ghost { background: none; border-color: transparent; color: var(--t2); }
.btn.ghost:hover { background: var(--neutral-fill); color: var(--t1); }
.btn.danger { background: var(--danger-fill); color: var(--danger-text); border-color: transparent; }
.btn.sm { height: var(--h-btn-sm); padding: 0 10px; font-size: var(--fs-sm); }
.btn.lg { height: var(--h-btn-lg); padding: 0 18px; font-size: var(--fs-lg); border-radius: var(--r-lg); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.ibtn {
  width: 30px; height: 30px; border-radius: var(--r-md); border: 0; background: none; color: var(--t2);
  display: inline-grid; place-items: center;
}
.ibtn:hover { background: var(--neutral-fill); color: var(--t1); }
.pill {
  height: var(--h-pill-sm); padding: 0 8px; border-radius: var(--r-pill);
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  font-size: var(--fs-xs); font-weight: 500; background: var(--neutral-fill); color: var(--t2);
}
.pill.ok { background: var(--success-fill); color: var(--success); }
.pill.warn { background: var(--warning-fill); color: var(--warning); }
.pill.bad { background: var(--danger-fill); color: var(--danger-text); }
.pill.acc { background: var(--accent-fill); color: var(--accent-text); }
.pill.ai { background: var(--edited-fill); color: var(--edited); }
.pill.red { background: var(--office-red); color: var(--office-on-red); }
.kbd { font-family: var(--mono); font-size: var(--fs-2xs); color: var(--t3); border: 1px solid var(--b); border-radius: 4px; padding: 0 5px; }
.switch { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; color: var(--t2); font-size: var(--fs-sm); padding: 4px; }
.switch .tr { width: 30px; height: 18px; border-radius: 99px; background: var(--s3); position: relative; transition: background var(--dur) var(--ease); }
.switch .tr::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--knob); transition: transform var(--dur) var(--ease); }
.switch.on .tr { background: var(--accent); }
.switch.on .tr::after { transform: translateX(12px); }
.seg { display: inline-flex; background: var(--s2); border-radius: var(--r-md); padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; height: 26px; padding: 0 10px; border-radius: 6px; color: var(--t2); font-size: var(--fs-sm); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.seg button.on { background: var(--s3); color: var(--t1); }
.seg button .n { font-family: var(--mono); font-size: var(--fs-2xs); color: var(--t3); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: var(--fs-sm); color: var(--t2); font-weight: 500; }
.field .help { font-size: var(--fs-xs); color: var(--t3); }
.input, .textarea, .select {
  width: 100%; background: var(--s2); border: 1px solid var(--bs); border-radius: var(--r-md);
  padding: 8px 10px; color: var(--t1); font-size: var(--fs-base);
}
.textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
.input:focus, .textarea:focus, .select:focus { outline: none; border-color: var(--accent-border); box-shadow: 0 0 0 3px var(--accent-fill-weak); }
.check { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; color: var(--t1); font-size: var(--fs-base); }
.check input { margin: 3px 0 0; accent-color: var(--accent); width: 15px; height: 15px; }
.check small { display: block; color: var(--t3); font-size: var(--fs-xs); }
.hr { height: 1px; background: var(--b); margin: 0; border: 0; }

/* Agent avatar: a quiet tile with the role's monogram. */
.av {
  width: 28px; height: 28px; border-radius: var(--r-md); flex: none;
  display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 600;
  letter-spacing: .02em; background: var(--s3); color: var(--t1); border: 1px solid var(--b);
}
.av.lg { width: 40px; height: 40px; font-size: 13px; border-radius: var(--r-lg); }
.av.sm { width: 22px; height: 22px; font-size: 9.5px; border-radius: 6px; }
.on-paper .av { background: rgba(30, 20, 20, .08); color: #2b1d1b; border-color: rgba(30, 20, 20, .1); }
.on-red .av { background: rgba(255, 255, 255, .16); color: var(--office-on-red); border-color: rgba(255, 255, 255, .2); }

/* ---------- Projects (app home) ---------- */
.home { max-width: var(--home-max); margin: 0 auto; padding: 56px var(--sp-6) 80px; width: 100%; }
.home-head { display: flex; align-items: flex-end; gap: var(--sp-4); margin-bottom: var(--sp-8); }
.home-head h1 { margin: 0; font-size: var(--fs-4xl); font-weight: 300; letter-spacing: var(--tracking-display); line-height: 1.1; }
.home-head h1 b { font-weight: 700; }
.home-head p { margin: 8px 0 0; color: var(--t2); max-width: 52ch; }
.ptable { width: 100%; border-collapse: collapse; table-layout: fixed; }
.ptable th:nth-child(1) { width: 38%; } .ptable th:nth-child(2) { width: 17%; } .ptable th:nth-child(3) { width: 21%; } .ptable th:nth-child(4) { width: 13%; }
.ptable th { text-align: left; font-size: var(--fs-xs); font-weight: 500; color: var(--t3); padding: 0 12px 10px; border-bottom: 1px solid var(--b); }
.ptable td { padding: 14px 12px; border-bottom: 1px solid var(--b-faint); vertical-align: middle; }
.ptable tr.prow { cursor: pointer; transition: background var(--dur-fast); }
.ptable tr.prow:hover { background: var(--neutral-fill); }
.pname { font-size: var(--fs-md); font-weight: 600; }
.pname small { display: block; font-weight: 400; color: var(--t3); font-size: var(--fs-sm); margin-top: 2px; }
.minitrack { display: flex; gap: 3px; }
.minitrack i { width: 14px; height: 4px; border-radius: 2px; background: var(--b); }
.minitrack i.done { background: var(--office-red); }
.minitrack i.cur { background: var(--t1); }
.minitrack i.live { background: var(--success); }
.home-foot { margin-top: var(--sp-6); color: var(--t3); font-size: var(--fs-sm); display: flex; gap: 8px; align-items: center; }

/* ---------- Office (project home) ---------- */
.office { max-width: 980px; margin: 0 auto; padding: 28px var(--sp-6) 72px; width: 100%; }
.ohead { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-6); align-items: end; margin-bottom: 22px; }
.otitle { margin: 0; font-size: 40px; line-height: .98; letter-spacing: -0.035em; font-weight: 300; }
.otitle b { font-weight: 700; display: block; }
/* The split label from the reference logos: one filled half, one outlined half. */
.split { display: inline-flex; margin-top: 16px; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em; line-height: 1.35; }
.split > div { padding: 8px 14px; border: 1px solid var(--t1); }
.split > div:first-child { background: var(--t1); color: var(--bg); }
.split > div b { display: block; font-weight: 700; }
.split > div b.mhead-live { display: flex; align-items: center; gap: 6px; }
.oactions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.track { display: flex; align-items: center; gap: 0; margin: 0 0 20px; font-size: var(--fs-sm); color: var(--t3); flex-wrap: wrap; row-gap: 6px; }
.track span { display: inline-flex; align-items: center; gap: 6px; }
.track span + span::before { content: ''; width: 18px; height: 1px; background: var(--bs); margin: 0 8px; }
.track .done { color: var(--t2); }
.track .cur { color: var(--t1); font-weight: 600; }
.track .live { color: var(--success); font-weight: 600; }
.vswitch { display: flex; gap: 8px; margin-bottom: 20px; }
.vtab { border: 1px solid var(--b); background: var(--s1); border-radius: var(--r-lg); padding: 8px 12px; text-align: left; color: var(--t2); display: flex; gap: 10px; align-items: center; }
.vtab.on { border-color: var(--bs); background: var(--s2); color: var(--t1); }
.vtab b { font-weight: 600; color: var(--t1); }

.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
.card {
  position: relative; aspect-ratio: 1 / 1; border-radius: var(--r-xl); border: 1px solid transparent;
  padding: 16px 18px; display: flex; flex-direction: column; text-align: left; overflow: hidden;
  transition: transform var(--dur) var(--ease-out), background-color 600ms var(--ease-out), color 600ms var(--ease-out), box-shadow var(--dur) var(--ease);
}
button.card { cursor: pointer; font: inherit; }
.card:hover:not(.locked) { transform: translateY(-3px); box-shadow: 0 14px 30px -18px rgba(0, 0, 0, .55); }
.card:active:not(.locked) { transform: translateY(-1px) scale(.995); }
.card .ctop { display: flex; align-items: center; gap: 8px; font-size: var(--fs-xs); font-weight: 500; }
.card .ctop .role { opacity: .78; }
.card .ctop .tag { margin-left: auto; }
.card .cbody { margin-top: auto; display: grid; grid-template-columns: 1fr; position: relative; }
.card { container-type: inline-size; }
.card .brush { font-family: var(--brush); font-size: 15cqw; font-weight: 650; line-height: 1; letter-spacing: -0.04em; }
.card .brush.long { font-size: 11cqw; }
.card .state { justify-self: end; font-size: var(--fs-sm); font-weight: 600; margin-top: 2px; }
.card .meta { position: absolute; left: 18px; right: 18px; bottom: 14px; display: flex; gap: 10px; font-size: var(--fs-2xs); opacity: 0; transform: translateY(4px); transition: opacity var(--dur), transform var(--dur); }
.card:hover .meta { opacity: .8; transform: none; }
.card:hover .cbody { transform: translateY(-14px); }
.card .cbody { transition: transform var(--dur) var(--ease-out); }
.card .no { position: absolute; top: 14px; right: 16px; font-family: var(--mono); font-size: var(--fs-2xs); opacity: .55; }
/* States */
.card.active, .card.waiting, .card.update { background: var(--office-paper); color: var(--office-ink); border-color: var(--b); }
.card.active .ctop, .card.waiting .ctop, .card.update .ctop, .card.active .meta, .card.waiting .meta, .card.update .meta { color: #3a2a27; }
.card.signed { background: var(--office-red); color: var(--office-on-red); }
.card.locked { background: var(--office-locked); color: var(--t3); border-color: var(--b); cursor: default; }
.card.locked .brush { opacity: .55; }
.card.locked .ctop .role { opacity: 1; }
.card.waiting .state { color: #8a5a00; }
.card.update { box-shadow: inset 0 0 0 2px var(--warning); }
.card.update .state { color: #8a5a00; }
.card.ready-flag::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 2px var(--accent); pointer-events: none; }
.card .ribbon { position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--warning); }

.card.shake { animation: shake 360ms var(--ease); }
@keyframes shake { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.card.unlocking { animation: unlock 900ms var(--ease-out) both; }
@keyframes unlock { 0% { transform: scale(.94); filter: saturate(0) brightness(.6); } 55% { transform: scale(1.03); } 100% { transform: none; filter: none; } }
.card.stamping .brush { animation: stamp 700ms var(--ease-out) both; }
@keyframes stamp { 0% { transform: scale(1.25) rotate(-4deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
.card .lockic { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -60%); opacity: .5; }

.below { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; margin-top: 28px; }
.panel { background: var(--s1); border: 1px solid var(--b); border-radius: var(--r-xl); padding: 16px 18px; }
.panel h3 { margin: 0 0 10px; font-size: var(--fs-md); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.lrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: var(--fs-sm2); color: var(--t2); }
.lrow + .lrow { border-top: 1px solid var(--b-faint); }
.lrow b { color: var(--t1); font-weight: 500; }
.lrow .when { margin-left: auto; color: var(--t3); font-size: var(--fs-xs); white-space: nowrap; }

/* ---------- Stage room ---------- */
.rtop {
  height: var(--v3-top-h); flex: none; display: flex; align-items: center; gap: 10px;
  padding: 0 var(--sp-3) 0 var(--sp-3); border-bottom: 1px solid var(--b);
}
.rtop .back { display: inline-flex; align-items: center; gap: 6px; }
.rtop .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.rtop .who .nm { font-weight: 600; white-space: nowrap; }
.rtop .who .rl { color: var(--t3); font-size: var(--fs-sm); white-space: nowrap; }
.vsep { width: 1px; height: 20px; background: var(--b); }
.banner { display: flex; align-items: center; gap: 10px; padding: 9px 16px; font-size: var(--fs-sm2); border-bottom: 1px solid var(--b); }
.banner.ready { background: var(--accent-fill-weak); color: var(--accent-text-strong); }
.banner.wait { background: var(--warning-fill); color: var(--warning); }
.banner.upd { background: var(--warning-fill); color: var(--warning); }
.banner.done { background: var(--neutral-fill); color: var(--t2); }
.banner .grow + .btn { margin-left: 0; }
.room { flex: 1 1 0; min-height: 0; display: flex; }
.chatcol { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
.side { width: 460px; flex: none; border-left: 1px solid var(--b); display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
.side.narrow { width: 400px; }
.side-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--b); }
.side-body { flex: 1 1 0; min-height: 0; overflow: auto; }

/* Claude Code chat (V3 look, docs/design/screens/v3/v3.css) */
.cc { font-family: var(--mono); font-size: var(--v3-cc-fs); line-height: var(--v3-cc-lh); color: var(--t-code); }
.cc-scroll { flex: 1 1 0; min-height: 0; overflow: auto; padding: 22px 24px 12px; }
.cc-col { width: 100%; max-width: var(--prompt-max); margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.cc-user { display: grid; grid-template-columns: 18px 1fr; padding: 6px 10px 6px 8px; border-radius: var(--r-sm); background: var(--neutral-fill); color: var(--t1); }
.cc-user::before { content: '>'; color: var(--t3); }
.cc-msg { display: grid; grid-template-columns: 18px 1fr; color: var(--t1); }
.cc-msg::before { content: '\25CF'; font-size: 10px; line-height: calc(var(--v3-cc-fs) * var(--v3-cc-lh)); color: var(--t1); }
.cc-msg.tool::before { color: var(--success); }
.cc-msg.tool.ask::before { color: var(--warning); }
.cc-msg.think::before { content: '\273B'; font-size: var(--v3-cc-fs); color: var(--t3); }
.cc-msg.think { color: var(--t3); font-style: italic; }
.cc-msg p { margin: 0 0 8px; } .cc-msg p:last-child { margin-bottom: 0; }
.cc-msg ol, .cc-msg ul { margin: 0 0 8px; padding-left: 20px; } .cc-msg li { margin: 2px 0; }
.cc-msg b { color: var(--t1); font-weight: 600; }
.cc-msg code { color: var(--accent-text); }
.cc-tool { color: var(--t1); font-weight: 600; } .cc-arg { color: var(--t2); }
.cc-res { display: grid; grid-template-columns: 18px 1fr; color: var(--t3); }
.cc-res::before { content: '\23BF'; padding-left: 3px; }
.cc-step { display: flex; flex-direction: column; gap: 2px; }
.cc-fold { display: grid; grid-template-columns: 18px 1fr; color: var(--t3); }
.cc-fold::before { content: '\25B8'; }
.cc-file { display: inline-flex; align-items: center; gap: 8px; height: 28px; margin: 4px 0 0 18px; padding: 0 4px 0 10px; border: 1px solid var(--b); border-radius: var(--r-md); background: var(--s1); font-size: 12px; color: var(--t1); width: fit-content; cursor: pointer; }
.cc-file .ic { color: var(--t3); }
.cc-file .open { height: 20px; padding: 0 8px; border-radius: 4px; background: var(--s3); color: var(--t1); font-family: var(--sans); font-size: var(--fs-xs); font-weight: 500; display: inline-flex; align-items: center; }
.cc-file .who { font-family: var(--sans); font-size: var(--fs-2xs); color: var(--t3); }
.cc-spin { display: flex; align-items: baseline; gap: 8px; color: var(--v3-spinner); }
.cc-spin .star { display: inline-block; width: 10px; animation: spin 1.6s linear infinite; }
.cc-spin .meta { color: var(--t3); }
@keyframes spin { to { transform: rotate(360deg); } }
.cc-ready { margin-left: 18px; border: 1px solid var(--accent-border); background: var(--accent-fill-weak); border-radius: var(--r-lg); padding: 10px 12px; color: var(--t1); font-family: var(--sans); font-size: var(--fs-base); display: flex; align-items: center; gap: 10px; }
.cc-ready .ic { color: var(--accent-text); }
.cc-qa { margin-left: 18px; border: 1px solid var(--b); border-radius: var(--r-lg); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.cc-qa div { display: grid; grid-template-columns: 22px 1fr; color: var(--t2); }
.cc-qa div span:first-child { color: var(--t3); }
.cc-empty { margin: 12vh auto 0; max-width: 460px; text-align: center; font-family: var(--sans); color: var(--t2); }
.cc-empty .av { margin: 0 auto 14px; }
.cc-empty h2 { font-size: var(--fs-xl); color: var(--t1); margin: 0 0 6px; font-weight: 600; }
.cc-empty p { margin: 0 0 14px; }
.cc-empty .sugg { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.cc-input-wrap { padding: 8px 24px 14px; }
.cc-input { display: grid; grid-template-columns: 18px 1fr auto; align-items: start; gap: 0; border: 1px solid var(--bs); border-radius: var(--r-lg); padding: 9px 8px 9px 12px; background: var(--s1); }
.cc-input .p { color: var(--t3); line-height: 22px; }
.cc-input textarea { border: 0; background: none; resize: none; outline: none; color: var(--t1); font-family: var(--mono); font-size: var(--v3-cc-fs); line-height: 22px; height: 22px; padding: 0; }
.cc-input textarea::placeholder { color: var(--t3); }
.cc-hint { display: flex; justify-content: space-between; padding: 6px 4px 0; font-size: var(--fs-2xs); color: var(--t3); }
.cc-hint .mode { color: var(--edited); }
.cc-hint .mode.off { color: var(--t3); }

/* Documents panel */
.docs-list { padding: 6px; border-bottom: 1px solid var(--b); }
.doc { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: var(--r-md); color: var(--t1); font-size: var(--fs-sm2); cursor: pointer; border: 0; background: none; width: 100%; text-align: left; }
.doc:hover { background: var(--neutral-fill); }
.doc.sel { background: var(--s2); }
.doc .ic.ok { color: var(--success); }
.doc .ic.todo { color: var(--t3); }
.doc .path { margin-left: auto; color: var(--t3); font-family: var(--mono); font-size: var(--fs-2xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 48%; }
.doc-view { padding: 16px 20px 28px; }
.doc-view .dh { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.doc-view .dh .t { font-weight: 600; font-size: var(--fs-md); }
.md { font-size: var(--fs-base); line-height: 1.6; color: var(--t2); }
.md h1 { font-size: var(--fs-xl); color: var(--t1); margin: 0 0 8px; letter-spacing: var(--tracking-tight); }
.md h2 { font-size: var(--fs-md); color: var(--t1); margin: 16px 0 6px; }
.md p { margin: 0 0 10px; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 18px; }
.md li { margin: 3px 0; }
.md b { color: var(--t1); }
.md code { font-family: var(--mono); font-size: 12px; color: var(--accent-text); }
.md table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); margin: 6px 0 12px; }
.md th, .md td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--b-faint); vertical-align: top; }
.md th { color: var(--t3); font-weight: 500; }
.md .callout { border-left: 2px solid var(--accent); padding: 4px 0 4px 12px; color: var(--t2); margin: 0 0 12px; }
.md pre { font-family: var(--mono); font-size: 12px; background: var(--code-bg); border-radius: var(--r-md); padding: 10px 12px; color: var(--t-code); overflow: auto; margin: 0 0 12px; }
.diagram { background: var(--code-bg); border-radius: var(--r-lg); padding: 12px; margin: 4px 0 12px; }
.diagram svg { width: 100%; height: auto; display: block; }
.diagram text { font-family: var(--sans); font-size: 11px; fill: var(--t1); }
.diagram .bx { fill: var(--s2); stroke: var(--bs); }
.diagram .bx.hi { fill: var(--accent-fill); stroke: var(--accent-border); }
.diagram .ln { stroke: var(--t3); stroke-width: 1.2; fill: none; marker-end: url(#arr); }
.diagram .sub { fill: var(--t3); font-size: 10px; }
.gantt { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; font-size: var(--fs-xs); margin: 6px 0 12px; align-items: center; }
.gantt .bar { height: 10px; border-radius: 3px; background: var(--s3); position: relative; }
.gantt .bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); opacity: .8; }

/* Questions for the client (Requirements) */
.qs { padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 10px; }
.q { border: 1px solid var(--b); border-radius: var(--r-lg); padding: 10px 12px; background: var(--s1); }
.q .qh { display: flex; gap: 10px; align-items: flex-start; }
.q .qh input { margin-top: 3px; accent-color: var(--accent); }
.q .qt { color: var(--t1); font-size: var(--fs-base); }
.q .qa { margin: 8px 0 0 25px; }
.q .qa textarea { min-height: 38px; font-size: var(--fs-sm); }
.q.answered { border-color: var(--b-faint); }

/* Work areas: Design canvas, Development, Testing, Deployment */
.work { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.work-head { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--b); }
.canvas { flex: 1 1 0; min-height: 0; overflow: auto; background:
  radial-gradient(circle, var(--b) 1px, transparent 1.2px) 0 0 / 18px 18px, var(--code-bg-deep);
  padding: 36px; display: flex; gap: 36px; align-items: flex-start; }
.phone { width: 214px; flex: none; }
.phone .cap { font-size: var(--fs-xs); color: var(--t2); margin-bottom: 8px; display: flex; gap: 6px; align-items: center; }
.phone .scr { height: 440px; border-radius: 30px; border: 7px solid #232326; background: #f7f6f3; color: #1b1b1d; overflow: hidden; position: relative; font-family: var(--sans); box-shadow: 0 30px 50px -30px rgba(0,0,0,.6); }
.phone.sel .scr { outline: 2px solid var(--accent); outline-offset: 4px; }
.phone .scr .sb { height: 26px; display: flex; justify-content: space-between; padding: 6px 16px 0; font-size: 9px; font-weight: 600; }
.ph-pad { padding: 8px 14px; }
.ph-h { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; margin: 4px 0 10px; }
.ph-card { background: #fff; border-radius: 12px; padding: 10px; margin-bottom: 8px; font-size: 10px; box-shadow: 0 1px 0 rgba(0,0,0,.05); }
.ph-card b { font-size: 11px; display: block; }
.ph-red { background: #d92b26; color: #fff; }
.ph-bar { height: 5px; border-radius: 3px; background: #ebe8e3; margin-top: 6px; overflow: hidden; }
.ph-bar i { display: block; height: 100%; background: #d92b26; }
.ph-tab { position: absolute; bottom: 0; left: 0; right: 0; height: 40px; background: #fff; display: flex; justify-content: space-around; align-items: center; font-size: 8.5px; color: #8a8a90; border-top: 1px solid #eee; }
.ph-tab .on { color: #d92b26; font-weight: 700; }
.ph-chip { display: inline-block; padding: 3px 8px; border-radius: 99px; background: #ebe8e3; font-size: 9px; margin: 0 4px 6px 0; }
.ph-chip.on { background: #1b1b1d; color: #fff; }
.pin { position: absolute; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 3px rgba(91,141,239,.25); }

.dev { flex: 1 1 0; display: flex; min-height: 0; min-width: 0; }
.explorer { width: 230px; flex: none; border-right: 1px solid var(--b); overflow: auto; padding: 8px 6px; font-size: var(--fs-sm); }
.explorer .h { font-size: var(--fs-2xs); color: var(--t3); text-transform: uppercase; letter-spacing: .06em; padding: 4px 8px 6px; }
.tree { display: flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 6px; color: var(--t2); cursor: pointer; white-space: nowrap; }
.tree:hover { background: var(--neutral-fill); }
.tree.sel { background: var(--s2); color: var(--t1); }
.tree .ic { color: var(--t3); }
.tree .m { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--edited); }
.tabs { display: flex; border-bottom: 1px solid var(--b); height: 36px; flex: none; }
.tab { display: inline-flex; align-items: center; gap: 7px; padding: 0 14px; border: 0; border-right: 1px solid var(--b); background: none; color: var(--t2); font-size: var(--fs-sm); position: relative; }
.tab.on { color: var(--t1); background: var(--bg); }
.tab.on::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--accent); }
.code { flex: 1 1 0; overflow: auto; background: var(--code-bg); font-family: var(--mono); font-size: 12.5px; line-height: 1.65; padding: 12px 0; color: var(--t-code); }
.code div { display: grid; grid-template-columns: 46px 1fr; white-space: pre; }
.code .ln { color: var(--t-gutter); text-align: right; padding-right: 14px; }
.code .add { background: var(--diff-add-bg); }
.k { color: #c792ea; } .s { color: #c3e88d; } .f { color: #82aaff; } .c { color: var(--t3); } .tg { color: #f07178; } .at { color: #ffcb6b; }
[data-theme='cherry-light'] .k { color: #7c4dce; } [data-theme='cherry-light'] .s { color: #1f7a33; } [data-theme='cherry-light'] .f { color: #2f6fc4; } [data-theme='cherry-light'] .tg { color: #a1231f; } [data-theme='cherry-light'] .at { color: #9a6700; }
.term { flex: 1 1 0; overflow: auto; background: var(--code-bg-deep); font-family: var(--mono); font-size: 12.5px; line-height: 1.6; padding: 12px 16px; color: var(--t-code); white-space: pre-wrap; }
.term .ok { color: var(--success); } .term .p { color: var(--accent-text); }

.gate { padding: 14px 16px; display: flex; flex-direction: column; gap: 0; }
.gstep { display: grid; grid-template-columns: 24px 1fr; gap: 10px; padding: 0 0 18px; position: relative; }
.gstep::before { content: ''; position: absolute; left: 11px; top: 24px; bottom: 2px; width: 1px; background: var(--b); }
.gstep:last-child::before { display: none; }
.gstep .dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--s2); color: var(--t3); border: 1px solid var(--b); }
.gstep.done .dot { background: var(--success-fill); color: var(--success); border-color: transparent; }
.gstep.now .dot { background: var(--accent-fill); color: var(--accent-text); border-color: var(--accent-border); }
.gstep.wait .dot { background: var(--warning-fill); color: var(--warning); border-color: transparent; }
.gstep .gt { font-weight: 600; color: var(--t1); font-size: var(--fs-base); line-height: 24px; }
.gstep .gd { color: var(--t2); font-size: var(--fs-sm); margin-top: 2px; }
.gstep .ga { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }

.dash { flex: 1 1 0; overflow: auto; padding: 22px 24px 40px; }
.dash h2 { font-size: var(--fs-xl); margin: 0 0 4px; font-weight: 600; }
.dash .sub { color: var(--t2); margin: 0 0 18px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.stat { background: var(--s1); border: 1px solid var(--b); border-radius: var(--r-xl); padding: 12px 14px; }
.stat .v { font-size: var(--fs-2xl); font-weight: 600; font-family: var(--mono); letter-spacing: -0.02em; }
.stat .l { color: var(--t3); font-size: var(--fs-xs); }
.tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-sm2); }
.tbl th { text-align: left; color: var(--t3); font-weight: 500; font-size: var(--fs-xs); padding: 6px 10px; border-bottom: 1px solid var(--b); }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--b-faint); color: var(--t2); vertical-align: middle; }
.tbl td b { color: var(--t1); font-weight: 500; }
.sect { margin-bottom: 26px; }
.sect > h3 { font-size: var(--fs-md); font-weight: 600; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.pipe { display: flex; align-items: stretch; gap: 0; margin-bottom: 4px; }
.pstep { flex: 1; background: var(--s1); border: 1px solid var(--b); padding: 10px 12px; position: relative; }
.pstep:first-child { border-radius: var(--r-lg) 0 0 var(--r-lg); }
.pstep:last-child { border-radius: 0 var(--r-lg) var(--r-lg) 0; }
.pstep + .pstep { border-left: 0; }
.pstep .pt { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: var(--fs-sm2); }
.pstep .pd { color: var(--t3); font-size: var(--fs-xs); font-family: var(--mono); margin-top: 2px; }
.pstep.ok .pt .ic { color: var(--success); }
.pstep.run .pt .ic { color: var(--accent-text); animation: spin 1.6s linear infinite; }
.pstep.wait .pt .ic { color: var(--t3); }
.envs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.env { background: var(--s1); border: 1px solid var(--b); border-radius: var(--r-xl); padding: 14px; }
.env .eh { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 8px; }
.env .kv { display: grid; grid-template-columns: 100px 1fr; gap: 4px 10px; font-size: var(--fs-sm); color: var(--t2); }
.env .kv span:nth-child(odd) { color: var(--t3); }
.checks { display: flex; flex-direction: column; gap: 2px; }
.chk { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--r-md); font-size: var(--fs-sm2); color: var(--t2); cursor: pointer; }
.chk:hover { background: var(--neutral-fill); }
.chk .bx { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--bs); display: grid; place-items: center; flex: none; }
.chk.on { color: var(--t1); }
.chk.on .bx { background: var(--success); border-color: var(--success); color: var(--bg); }
.chk .r { margin-left: auto; color: var(--t3); font-size: var(--fs-xs); }

/* ---------- Maintenance ---------- */
.mhead-live { display: inline-flex; align-items: center; gap: 8px; }
.livedot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: var(--status-dot-glow-success); }
.mgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.mgrid .card { aspect-ratio: 4 / 3; }
.card.room { background: var(--s1); color: var(--t1); border-color: var(--b); }
.card.room .brush { color: var(--t1); }
.card.room .state { color: var(--t2); font-weight: 500; }
.card.room.hot { background: var(--office-paper); color: var(--office-ink); }
.card.room.hot .brush { color: var(--office-ink); }
.card.room.hot .ctop, .card.room.hot .state { color: #3a2a27; }
.card.room.newv { background: var(--office-red); color: var(--office-on-red); border-color: transparent; }
.card.room.newv .brush, .card.room.newv .state { color: var(--office-on-red); }
.health { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
.spark { display: flex; align-items: flex-end; gap: 2px; height: 22px; margin-top: 6px; }
.spark i { flex: 1; background: var(--success); opacity: .55; border-radius: 1px; }

/* ---------- Modal, toast, drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); display: grid; place-items: center; z-index: 40; animation: fade var(--dur) var(--ease); padding: 16px; }
@keyframes fade { from { opacity: 0; } }
.modal { width: 540px; max-width: 100%; max-height: calc(100dvh - 32px); overflow: auto; background: var(--s1); border: 1px solid var(--bs); border-radius: var(--r-2xl); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .7); animation: pop 260ms var(--ease-out); }
.modal.wide { width: 640px; }
@keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } }
.mh { padding: 18px 20px 6px; display: flex; gap: 12px; align-items: flex-start; }
.mh h2 { margin: 0; font-size: var(--fs-xl); font-weight: 600; }
.mh p { margin: 4px 0 0; color: var(--t2); font-size: var(--fs-base); }
.mb { padding: 12px 20px; display: flex; flex-direction: column; gap: 14px; }
.mf { padding: 14px 20px 18px; display: flex; gap: 8px; justify-content: flex-end; align-items: center; border-top: 1px solid var(--b); margin-top: 6px; }
.mf .left { margin-right: auto; color: var(--t3); font-size: var(--fs-xs); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opt { border: 1px solid var(--b); border-radius: var(--r-lg); padding: 12px 14px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; background: var(--s1); text-align: left; width: 100%; }
.opt:hover { border-color: var(--bs); }
.opt.on { border-color: var(--accent-border); background: var(--accent-fill-weak); }
.opt .ot { font-weight: 600; color: var(--t1); display: flex; align-items: center; gap: 8px; }
.opt .od { color: var(--t2); font-size: var(--fs-sm); margin-top: 2px; }
.impact { border: 1px solid var(--b); border-radius: var(--r-lg); overflow: hidden; }
.impact .ir { display: grid; grid-template-columns: 130px 1fr auto; gap: 10px; padding: 10px 12px; font-size: var(--fs-sm2); align-items: center; }
.impact .ir + .ir { border-top: 1px solid var(--b-faint); }
.impact .ir b { color: var(--t1); font-weight: 600; }
.impact .ir span { color: var(--t2); }
.note-ai { border-left: 2px solid var(--edited); padding: 2px 0 2px 12px; color: var(--t2); font-size: var(--fs-sm2); }
.toasts { position: fixed; right: 16px; bottom: 40px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--s-float); border: 1px solid var(--bs); border-radius: var(--r-lg); padding: 10px 14px; font-size: var(--fs-sm2); display: flex; gap: 10px; align-items: center; box-shadow: 0 16px 40px -16px rgba(0,0,0,.6); animation: pop 240ms var(--ease-out); max-width: 380px; }
.toast .ic { color: var(--accent-text); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 400px; max-width: 100%; background: var(--s-float); border-left: 1px solid var(--bs); z-index: 45; display: flex; flex-direction: column; animation: slide 300ms var(--ease-out); box-shadow: -30px 0 60px -30px rgba(0,0,0,.6); }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } }

/* Go Live moment */
.golive { position: fixed; inset: 0; z-index: 70; background: var(--office-red); color: var(--office-on-red); display: grid; place-items: center; text-align: center; animation: fade 400ms var(--ease-out); }
.golive .big { font-family: var(--brush); font-weight: 700; letter-spacing: -0.05em; font-size: min(24vw, 220px); line-height: .9; animation: stamp 900ms var(--ease-out) both; }
.golive p { font-size: var(--fs-xl); margin: 18px 0 26px; opacity: .92; }
.golive .btn { background: var(--office-on-red); color: var(--office-red); border: 0; }

/* Demo controls */
.demo { position: fixed; left: 14px; bottom: 36px; z-index: 50; }
.demo-fab { height: 34px; padding: 0 12px; border-radius: var(--r-pill); border: 1px solid var(--bs); background: var(--s-float); color: var(--t1); display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-sm); font-weight: 500; box-shadow: 0 10px 30px -12px rgba(0,0,0,.6); }
.demo-panel { position: absolute; left: 0; bottom: 42px; width: 290px; background: var(--s-float); border: 1px solid var(--bs); border-radius: var(--r-xl); padding: 12px; box-shadow: 0 20px 50px -20px rgba(0,0,0,.7); animation: pop 200ms var(--ease-out); }
.demo-panel .dt { font-size: var(--fs-xs); color: var(--t3); margin: 4px 2px 8px; }
.demo-panel .db { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
.demo-panel .db button { justify-content: flex-start; }

/* Component sheet */
.sheet { max-width: 1180px; margin: 0 auto; padding: 36px 24px 80px; }
.sheet h1 { font-size: var(--fs-3xl); font-weight: 300; margin: 0 0 4px; letter-spacing: var(--tracking-display); }
.sheet h1 b { font-weight: 700; }
.sheet > p { color: var(--t2); margin: 0 0 28px; }
.sheet section { margin-bottom: 36px; }
.sheet section > h2 { font-size: var(--fs-md); font-weight: 600; margin: 0 0 12px; color: var(--t1); }
.sheet .grid5 { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
.sheet .grid5 .card { pointer-events: none; }

.avs { display: flex; gap: 18px; flex-wrap: wrap; }
.avs > div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--t2); width: 88px; text-align: center; }

/* ---------- V4.1: project tabs, statusline, version control, usage, invoice, settings ---------- */
.ptabs { display: flex; align-items: stretch; align-self: stretch; gap: 2px; margin-left: 8px; }
.ptab { border: 0; background: none; color: var(--t2); padding: 0 10px; font-size: var(--fs-base); font-weight: 500; position: relative; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.ptab:hover { color: var(--t1); }
.ptab.on { color: var(--t1); }
.ptab.on::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--t1); border-radius: 2px; }
.pname-h { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
.sl { display: flex; gap: 14px; flex-wrap: wrap; padding: 7px 4px 0; font-family: var(--mono); font-size: var(--fs-2xs); color: var(--t3); align-items: center; }
.sl .mode { color: var(--edited); } .sl .mode.off { color: var(--t3); }
.sl .ubm { display: inline-block; width: 34px; height: 4px; border-radius: 2px; background: var(--s3); margin: 0 6px; overflow: hidden; vertical-align: middle; }
.sl .ubm i { display: block; height: 100%; background: var(--t2); }
.sl .ubm i.hi { background: var(--warning); }
.sl .r { margin-left: auto; }
.full { flex: 1 1 0; min-height: 0; display: flex; }
.vc { display: grid; grid-template-columns: 340px 1fr; flex: 1 1 0; min-height: 0; }
.vc-l { border-right: 1px solid var(--b); overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.vc-r { overflow: auto; padding: 18px 24px 40px; }
.vc h4 { margin: 0 0 6px; font-size: var(--fs-xs); font-weight: 500; color: var(--t3); display: flex; align-items: center; gap: 6px; }
.frow { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; font-size: var(--fs-sm2); color: var(--t1); cursor: pointer; border: 0; background: none; width: 100%; text-align: left; }
.frow:hover { background: var(--neutral-fill); }
.frow > span:not(.p):not(.k) { white-space: nowrap; }
.frow .p { color: var(--t3); font-family: var(--mono); font-size: var(--fs-2xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frow .k { margin-left: auto; font-family: var(--mono); font-size: 11px; font-weight: 600; }
.k-M { color: var(--warning); } .k-A { color: var(--success); } .k-D { color: var(--danger-text); }
.commit { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; padding: 9px 0; position: relative; cursor: pointer; }
.commit::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 1px; background: var(--b); }
.commit:first-child::before { top: 15px; }
.commit .gd { width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 2px solid var(--t3); margin: 5px 0 0 4px; position: relative; z-index: 1; }
.commit.head .gd { border-color: var(--accent); background: var(--accent); }
.commit .cm { color: var(--t1); font-size: var(--fs-base); }
.commit .cd { color: var(--t3); font-size: var(--fs-xs); display: flex; gap: 8px; align-items: center; margin-top: 2px; flex-wrap: wrap; }
.commit .cf { grid-column: 2 / 4; display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.commit:hover .cm { color: var(--accent-text-strong); }
.bars { display: flex; flex-direction: column; gap: 10px; }
.ubar { display: grid; grid-template-columns: 130px 1fr 170px; gap: 12px; align-items: center; font-size: var(--fs-sm2); }
.ubar .tr { height: 6px; border-radius: 3px; background: var(--s3); overflow: hidden; }
.ubar .tr i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.ubar .tr i.warn { background: var(--warning); }
.ubar .v { text-align: right; font-family: var(--mono); font-size: var(--fs-xs); color: var(--t2); }
.tbl tr.hl td { background: var(--accent-fill-weak); }
.tbl td.num, .tbl th.num { text-align: right; font-family: var(--mono); font-size: var(--fs-sm); }
.tbl tfoot td { border-top: 1px solid var(--bs); border-bottom: 0; color: var(--t1); font-weight: 600; }
.inv { background: var(--s1); border: 1px solid var(--b); border-radius: var(--r-xl); padding: 22px 24px; }
.inv .ih { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.inv .ih h3 { margin: 0; font-size: var(--fs-xl); }
.inv .total { display: flex; justify-content: space-between; font-size: var(--fs-xl); font-weight: 600; padding-top: 12px; border-top: 1px solid var(--bs); margin-top: 6px; }
.addrow { display: grid; grid-template-columns: 1fr 140px 110px auto; gap: 8px; margin-top: 10px; }
.cols2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 24px; align-items: start; }
.set { display: grid; grid-template-columns: 220px 1fr; flex: 1 1 0; min-height: 0; }
.set-nav { border-right: 1px solid var(--b); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
.set-nav button { border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: var(--r-md); color: var(--t2); font-size: var(--fs-base); display: flex; gap: 8px; align-items: center; }
.set-nav button:hover { background: var(--neutral-fill); color: var(--t1); }
.set-nav button.on { background: var(--s2); color: var(--t1); }
.set-main { overflow: auto; padding: 24px 28px 48px; }

function sendChat(text) {
  if (!text.trim()) return;
  if (st.view === 'mroom') {
    st.bugfix.extra.push(u(esc(text)), spin());
    render();
    setTimeout(() => { st.bugfix.extra.pop(); st.bugfix.extra.push(m(`<p>${EXTRA_REPLY.bugfix}</p>`)); render(); }, 1300);
    return;
  }
  if (st.view !== 'stage') { toast('Sample only in this view'); return; }
  const s = S[st.stage]; const x = st.p.stages[s.id];
  if (x.chatLen === 0) {
    // First job: play the scripted conversation.
    x.chatLen = 1; x.extra = [];
    CHATS[s.id][0] = u(esc(text));
    render();
    let i = 1;
    const step = () => {
      if (i >= CHATS[s.id].length) { if (CHATS[s.id][CHATS[s.id].length - 1].includes('cc-ready')) { x.ready = true; toast(`${s.agent}: ${s.name} is ready for sign-off`); } render(); return; }
      x.extra = [spin()]; render();
      setTimeout(() => { x.extra = []; x.chatLen = ++i; render(); setTimeout(step, 250); }, 520);
    };
    setTimeout(step, 300);
    return;
  }
  x.extra.push(u(esc(text)), spin()); render();
  setTimeout(() => { x.extra.pop(); x.extra.push(m(`<p>${EXTRA_REPLY[s.id]}</p>`)); render(); }, 1200);
}
const spin = () => `<div class="cc-spin"><span class="star">✻</span><span>Working…</span><span class="meta">(esc to interrupt)</span></div>`;

function doSignoff(id) {
  const p = st.p; const x = p.stages[id]; const s = S[id];
  const internal = document.getElementById('so-int')?.checked;
  const who = document.getElementById('so-w')?.value || 'client';
  const wasUpdate = x.state === 'update';
  x.state = 'signed'; x.ready = true; x.synced = false;
  x.approval = { who, date: '6 Nov', internal };
  closeModal();
  if (wasUpdate) {
    toast(`${s.name} signed off again. Flag cleared.`);
    st.justSigned = id; go('office'); return;
  }
  if (id === 'deployment') { goLive(); return; }
  const nx = STAGES[s.i + 1];
  if (nx && p.stages[nx.id].state === 'locked') { p.stages[nx.id].state = 'active'; p.stages[nx.id].ready = false; p.stages[nx.id].chatLen = 0; st.justUnlocked = nx.id; }
  st.justSigned = id;

}

document.addEventListener('input', (e) => {
  if (e.target.id === 'eta') { edSync(false); return; }
  if (e.target.id === 'ed-q') { st.ed.q = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById('ed-q'); q.focus(); q.setSelectionRange(pos, pos); return; }
  if (e.target.id === 'v-q') { st.vQ = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById('v-q'); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener('keyup', (e) => { if (e.target.id === 'eta' && /Arrow|Home|End|Page/.test(e.key)) edSync(false); });
document.addEventListener('click', (e) => { if (e.target.id === 'eta') edSync(false); }, true);
document.addEventListener('keydown', (e) => {
  const inCode = st.view !== 'stage' && st.ptab === 'code' && ['office', 'maint'].includes(st.view);
  if (inCode && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); edSave(); return; }
  if (inCode && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') { e.preventDefault(); quickOpen(); return; }
  if (inCode && e.ctrlKey && e.key === '`') { e.preventDefault(); st.ed.panel = !st.ed.panel; render(); return; }
  if (e.target.id === 'eta' && e.key === 'Tab') { e.preventDefault(); const t = e.target; const a2 = t.selectionStart; t.setRangeText('  ', a2, t.selectionEnd, 'end'); edSync(false); return; }
  if (e.key === 'Escape') { closeModal(); }
  if (e.target.id === 'ccin' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(e.target.value); }
  if (e.target.id === 'mgin' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); mgSend(); }
  if (e.target.id === 'mtin' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); meetSend(); }
  if (e.key === 'Enter' && e.target.classList.contains('prow')) e.target.click();
});

render();
})();
</script>
</body>
</html>
